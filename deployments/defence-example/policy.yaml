# Deployment policy: retention, sync, OGC exposure and extra indexes per kind. Kinds not listed use defaults.
# sync.priority: critical | operational | bulk;  sync.mode: full | downsample | latest | on_request
deployment: defence-example
description: 'Illustrative ISR deployment: core plus disconnected edge sites.'
defaults:
  retention: P1Y
  sync:
    priority: operational
    mode: full
kinds:
  track.raw:
    retention: PT1H
    table: ume_raw
    sync:
      priority: bulk
      mode: on_request
  sensor.detection:
    retention: P7D
    ogc_collection: detections
    sync:
      priority: bulk
      mode: on_request
  track.fused:
    retention: P90D
    ogc_collection: tracks
    sync:
      priority: operational
      mode: downsample
      rate_hz: 1
  track.command:
    retention: P5Y
    sync:
      priority: critical
      mode: full
  video.segment:
    retention: P30D
    ogc_collection: video
    sync:
      priority: bulk
      mode: on_request
      assets:
      - thumbnail
      - klv
  imagery.ortho:
    retention: P1Y
    ogc_collection: imagery
    sync:
      priority: bulk
      mode: on_request
      assets:
      - thumbnail
  sensor.status:
    retention: P30D
    ogc_collection: sensors
    sync:
      priority: operational
      mode: latest
nodes:
  site-a:
    kinds:
      video.segment:
        sync:
          priority: bulk
          mode: full
