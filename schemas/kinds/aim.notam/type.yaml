# Type definition for aim.notam.
# envelope: rules the envelope must meet (checked by tools/validate.py). required | optional | not_allowed
# z: heights in geometry positions; vertical_extent: lower/upper height limits on a 2D Polygon/MultiPolygon geometry (a volume).
# entity_id_template: how entity_id is derived ({id}, {source.id} or {payload.<field>}).
kind: aim.notam
schema: urn:schema:aim:notam:v1
status: draft
envelope:
  time: span
  geometry: required
  geometry_source:
  - defined
  z: not_allowed
  vertical_extent: required
  entity_id: required
  entity_id_template: urn:notam:{payload.notam_id}
  required_assets:
  - data
source_event_id: NOTAM ID (series/number/year)
index_hints:
- payload->>'location'
- payload->>'q_code'
