# Type definition for track.fused.
# envelope: rules the envelope must meet (checked by tools/validate.py). required | optional | forbidden
# z: heights in geometry positions; place: a JSON-FG Prism for volumes.
# entity_id_template: how entity_id is derived ({id}, {source.id} or {payload.<field>}).
kind: track.fused
schema: urn:schema:tracks:fused-kinematics:v1
status: draft
envelope:
  time: instant
  geometry: required
  geometry_source:
  - observed
  z: optional
  place: forbidden
  entity_id: required
  entity_id_template: urn:track:{payload.track_id}
  required_assets: []
source_event_id: track_id + Trackgen update sequence
index_hints:
- payload->>'callsign'
- payload->>'squawk'
- payload->>'target_address'
