# Type definition for track.raw.
# envelope: rules the envelope must meet (checked by tools/validate.py). required | optional | forbidden
# z: heights in geometry positions; place: a JSON-FG Prism for volumes.
# entity_id_template: how entity_id is derived ({id}, {source.id} or {payload.<field>}).
kind: track.raw
schema: urn:schema:tracks:raw-message:v1
status: draft
envelope:
  time: instant
  geometry: required
  geometry_source:
  - sensor_coverage
  - sensor
  z: forbidden
  place: forbidden
  entity_id: forbidden
  required_assets:
  - data
source_event_id: ASTERIX SAC/SIC + target address + time of applicability in 1/128 s (SAC/SIC:address:ticks)
index_hints:
- payload->>'sequence'
