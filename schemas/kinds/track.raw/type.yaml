# Type definition for track.raw. Ships with the product; deployment choices (retention, sync, exposure) are in deployments/.
# envelope: rules the envelope must meet (checked by tools/validate.py). required | optional | forbidden
# entity_id_template: how entity_id is derived ({id}, {source.id} or {payload.<field>}).
kind: track.raw
schema: urn:schema:tracks:raw-message:v1
status: draft
envelope:
  time: instant
  geometry: required
  geometry_source:
  - sensor_coverage
  - sensor
  height_range: forbidden
  entity_id: forbidden
  required_assets:
  - data
source_event_id: ASTERIX SAC/SIC + receiver sequence number (SAC/SIC:sequence)
index_hints:
- payload->>'sequence'
