# Type definition for utm.intent_state.
# envelope: rules the envelope must meet (checked by tools/validate.py). required | optional | forbidden
# z: heights in geometry positions; vertical_extent: lower/upper height limits on a 2D Polygon/MultiPolygon geometry (a volume).
# entity_id_template: how entity_id is derived ({id}, {source.id} or {payload.<field>}).
kind: utm.intent_state
schema: urn:schema:utm:intent-state:v1
status: draft
envelope:
  time: instant
  geometry: optional
  geometry_source:
  - defined
  z: forbidden
  vertical_extent: forbidden
  entity_id: required
  entity_id_template: urn:uuid:{payload.operational_intent_id}
  required_assets: []
source_event_id: operational_intent_id:version:state
index_hints:
- payload->>'state'
