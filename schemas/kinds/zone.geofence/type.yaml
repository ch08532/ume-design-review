# Type definition for zone.geofence.
# envelope: rules the envelope must meet (checked by tools/validate.py). required | optional | forbidden
# z: heights in geometry positions; place: a JSON-FG Prism for volumes.
# entity_id_template: how entity_id is derived ({id}, {source.id} or {payload.<field>}).
kind: zone.geofence
schema: urn:schema:zones:geofence:v1
status: draft
envelope:
  time: span
  geometry: required
  geometry_source:
  - defined
  z: forbidden
  place: required
  entity_id: required
  required_assets: []
source_event_id: Zone registry ID + version
index_hints:
- payload->>'zone_type'
